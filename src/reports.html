<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://images.unsplash.com https://plus.unsplash.com; connect-src 'self' https://api.unsplash.com"
    />
    <title>Reports</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg" id="bg" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <main class="reports">
      <header class="rpt-head">
        <h1 class="rpt-title">Reports</h1>
        <div class="rpt-range">
          <div class="chips" id="chips">
            <button class="chip" data-preset="7d">7d</button>
            <button class="chip is-on" data-preset="30d">30d</button>
            <button class="chip" data-preset="90d">90d</button>
            <button class="chip" data-preset="all">All</button>
          </div>
          <label class="rpt-date">From <input type="date" id="fromDate" /></label>
          <label class="rpt-date">To <input type="date" id="toDate" /></label>
        </div>
        <p class="rpt-span" id="rangeSpan"></p>
      </header>

      <section class="tiles" id="tiles"></section>

      <section class="card">
        <h2 class="card-title">Focus over time</h2>
        <div id="trend" class="trend"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Project split</h2>
        <div id="split" class="split"></div>
      </section>

      <section class="card">
        <h2 class="card-title">Total hours by project</h2>
        <div id="totals" class="totals"></div>
      </section>
    </main>

    <script type="module" src="reports.mjs"></script>
  </body>
</html>
